<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Shop Mystery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrap">
        <h1>The Flower Shop Robbery</h1>
        <nav>
            <a href="about.html">About Me</a>
            <a href="game.html">Play the game</a>
        </nav>

        <h5>Your friend Daisy owns a flower shop in your town. One night at 3:00 a.m., the shop is robbed. All of the roses, her best-selling flowers, are gone. You must solve the mystery and discover who is responsible.</h5>

        <div class="image-row">
            <img src="https://th.bing.com/th/id/OIP.X3D6-ejlfxDQrr9PahU8oQHaHa?w=216&h=216&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3" alt="roses" width="200" height="200">
            <img src="https://th.bing.com/th/id/OIP.UDbIySlEFrk3AnztQo-D3wHaFj?w=231&h=180&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3" alt="flower shop" width="200" height="200">
        </div>

        <form action="game.html">
            <label for="name">Your name:</label>
            <input type="text" id="name" name="name" placeholder="First and Last name">

            <label for="favcolor">Your favorite color:</label>
            <input type="text" id="favcolor" name="favcolor" placeholder="Favorite color">

            <label for="age">Your age:</label>
            <input type="number" id="age" name="age" placeholder="Age">

            <p>Are you excited to play this game?</p>
            <label for="so-excited">So excited!</label>
            <input type="radio" id="so-excited" name="feeling" value="so excited">
            <label for="not-excited">Not excited</label>
            <input type="radio" id="not-excited" name="feeling" value="not excited">

            <input type="submit" value="Submit">
        </form>
    </div>
</body>
</html>
