<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Shop Mystery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="game.html">Play the game</a></li>
                <li><a href="about.html">About the creator</a></li>
            </ul>
        </nav>
    </header>

    <main class="game-container">
        <header>
            <h1 id="scene-title"></h1>
            <h2 id="character-name"></h2>
        </header>

        <section class="story-box">
            <p id="scene-text"></p>
        </section>

        <section>
            <div id="choices-container"></div>
        </section>

        <section class="status-box">
            <p>Current HP:</p>
            <p id="health-display">100</p>

            <p>Inventory:</p>
            <p id="inventory-display">Empty</p>

            <p id="message-display"></p>
        </section>
    </main>
</body>
</html>
